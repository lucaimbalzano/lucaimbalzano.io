version: '3'

services:
  db:
    image: postgres:16-alpine
    container_name: personal-postgres
    ports:
      # Host 5434 avoids conflict when another Postgres already uses 5432
      - 5434:5432
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=honghongme
    volumes:
      - db:/var/lib/postgresql/data
    networks:
      - personal-network
  redis:
    image: redis:7-alpine
    container_name: personal-redis
    ports:
      # Host 6380 avoids conflict when another Redis already uses 6379
      - '6380:6379'
    volumes:
      - redis:/data
    networks:
      - personal-network

  serverless-redis-http:
    image: hiett/serverless-redis-http:latest
    container_name: personal-redis-http
    ports:
      - '8079:80'
    environment:
      - SRH_MODE=env
      - SRH_TOKEN=honghongme
      - SRH_CONNECTION_STRING=redis://redis:6379
    networks:
      - personal-network
    depends_on:
      - redis

volumes:
  db:
  redis:

networks:
  personal-network:
    driver: bridge
